```html
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroBI - Simulador</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #202124;
            color: white;
        }

        header {
            background: #111214;
            padding: 18px 30px;
            border-bottom: 2px solid #444;
        }

        header h1 {
            margin: 0;
            color: #4da3ff;
        }

        .contenidor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .panell {
            background: #292a2d;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0;
            color: #4da3ff;
        }

        textarea {
            width: 100%;
            height: 350px;
            resize: vertical;
            background: #111214;
            color: #00ff88;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 15px;
        }

        button {
            margin-top: 12px;
            margin-right: 8px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #assemblar {
            background: #4da3ff;
            color: white;
        }

        #pas {
            background: #f0ad4e;
            color: white;
        }

        #executar {
            background: #28a745;
            color: white;
        }

        #reiniciar {
            background: #dc3545;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .registres {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .registre {
            background: #111214;
            padding: 12px;
            border-radius: 6px;
        }

        .registre span {
            color: #aaa;
        }

        .valor {
            float: right;
            color: #00ff88;
            font-family: monospace;
        }

        .memoria {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .memoria-fila {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            font-family: monospace;
            border-bottom: 1px solid #333;
        }

        .memoria-fila.activa {
            background: #315a78;
        }

        .sortida {
            margin-top: 20px;

        .led {

        }

        @media (max-width: 800px) {
            .contenidor {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MicroBI - Simulador</h1>
</header>

<div class="contenidor">

    <!-- EDITOR -->
    <div class="panell">
        <h2>Programa Assembly</h2>

        <textarea id="codi">LDA #6
MUL #7
OUT 0
HLT</textarea>

        <br>

        <button id="assemblar" onclick="assemblar()">Assemblar</button>
        <button id="pas" onclick="executarPas()">Step</button>
        <button id="executar" onclick="executarPrograma()">Run</button>
        <button id="reiniciar" onclick="reiniciar()">Reset</button>

        <div id="missatge">
            Escriu un programa i prem "Assemblar".
        </div>
    </div>


    <!-- CPU -->
    <div class="panell">

        <h2>CPU</h2>

        <div class="registres">

            <div class="registre">
                <span>PC</span>
                <span class="valor" id="PC">0</span>
            </div>

            <div class="registre">
                <span>IR</span>
                <span class="valor" id="IR">---</span>
            </div>

            <div class="registre">
                <span>AC</span>
                <span class="valor" id="AC">0</span>
            </div>

            <div class="registre">
                <span>MAR</span>
                <span class="valor" id="MAR">0</span>
            </div>

            <div class="registre">
                <span>MDR</span>
                <span class="valor" id="MDR">0</span>
            </div>

        </div>


        <h2 style="margin-top:25px;">Memòria</h2>

        <div class="memoria" id="memoria"></div>


        <h2 style="margin-top:25px;">Eixides</h2>

        <div class="sortida">
            <div class="led" id="led0">0</div>
            <div class="led" id="led1">1</div>
            <div class="led" id="led2">2</div>
            <div class="led" id="led3">3</div>
            <div class="led" id="led4">4</div>
            <div class="led" id="led5">5</div>
            <div class="led" id="led6">6</div>
            <div class="led" id="led7">7</div>
        </div>

    </div>

</div>


<script>

    // =========================
    // ESTAT DE LA CPU
    // =========================

    let PC = 0;
    let AC = 0;
    let IR = "---";
    let MAR = 0;
    let MDR = 0;

    let memoria = new Array(256).fill(0);

    let programa = [];
    let assemblat = false;
    let aturat = false;


    // =========================
    // ACTUALITZAR PANTALLA
    // =========================

    function actualitzarCPU() {

        document.getElementById("PC").textContent = PC;
        document.getElementById("AC").textContent = AC;
        document.getElementById("IR").textContent = IR;
        document.getElementById("MAR").textContent = MAR;
        document.getElementById("MDR").textContent = MDR;

        mostrarMemoria();
    }


    // =========================
    // ASSEMBLER
    // =========================

    function assemblar() {

        let text = document.getElementById("codi").value;

        let linies = text.split("\n");

        programa = [];

        try {

            for (let i = 0; i < linies.length; i++) {

                let linia = linies[i].trim();

                // Ignorar línies buides
                if (linia === "") {
                    continue;
                }

                // Ignorar comentaris
                if (linia.startsWith(";")) {
                    continue;
                }

                let parts = linia.split(/\s+/);

                let instruccio = parts[0].toUpperCase();
                let argument = parts[1] || null;

                programa.push({
                    instruccio: instruccio,
                    argument: argument
                });
            }

            PC = 0;
            AC = 0;
            IR = "---";
            MAR = 0;
            MDR = 0;

            memoria.fill(0);

            assemblat = true;
            aturat = false;

            document.getElementById("missatge").textContent =
                "Programa assemblat correctament.";

            actualitzarCPU();

        } catch (error) {

            document.getElementById("missatge").textContent =
                "Error en assemblar el programa.";
        }
    }


    // =========================
    // OBTINDRE VALOR
    // =========================

    function obtenirValor(argument) {

        if (!argument) {
            return 0;
        }

        // #6 → número directe
        if (argument.startsWith("#")) {
            return parseInt(argument.substring(1));
        }

        // 25 → posició de memòria
        return memoria[parseInt(argument)] || 0;
    }


    // =========================
    // EXECUTAR UNA INSTRUCCIÓ
    // =========================

    function executarPas() {

        if (!assemblat) {
            document.getElementById("missatge").textContent =
                "Primer has d'assemblar el programa.";
            return;
        }

        if (aturat) {
            return;
        }

        if (PC >= programa.length) {
            aturat = true;
            return;
        }

        let actual = programa[PC];

        IR = actual.instruccio;

        MAR = PC;

        MDR = obtenirValor(actual.argument);

        switch (actual.instruccio) {

            case "LDA":

                AC = MDR;
                PC++;
                break;


            case "STA":

                memoria[parseInt(actual.argument)] = AC;
                PC++;
                break;


            case "ADD":

                AC += MDR;
                PC++;
                break;


            case "SUB":

                AC -= MDR;
                PC++;
                break;


            case "MUL":

                AC *= MDR;
                PC++;
                break;


            case "DIV":

                if (MDR === 0) {

                    document.getElementById("missatge").textContent =
                        "Error: no es pot dividir entre zero.";

                    aturat = true;
                    return;
                }

                AC = Math.floor(AC / MDR);
                PC++;
                break;


            case "MOD":

                AC = AC % MDR;
                PC++;
                break;


            case "JMP":

                PC = parseInt(actual.argument);
                break;


            case "JZ":

                if (AC === 0) {
                    PC = parseInt(actual.argument);
                } else {
                    PC++;
                }

                break;


            case "OUT":

                mostrarSortida(parseInt(actual.argument), AC);
                PC++;
                break;


            case "HLT":

                aturat = true;

                document.getElementById("missatge").textContent =
                    "Programa finalitzat.";

                break;


            default:

                document.getElementById("missatge").textContent =
                    "Instrucció desconeguda: " + actual.instruccio;

                aturat = true;
                return;
        }

        actualitzarCPU();
    }


    // =========================
    // RUN
    // =========================

    function executarPrograma() {

        if (!assemblat) {
            assemblar();
        }

        if (aturat) {
            return;
        }

        let interval = setInterval(function() {

            if (aturat || PC >= programa.length) {

                clearInterval(interval);
                return;
            }

            executarPas();

        }, 400);
    }


    // =========================
    // EIXIDES / LEDS
    // =========================

    function mostrarSortida(numero, valor) {

        let led = document.getElementById("led" + numero);

        if (!led) {
            return;
        }

        if (valor !== 0) {
            led.classList.add("encés");
        } else {
            led.classList.remove("encés");
        }
    }


    // =========================
    // MEMÒRIA
    // =========================

    function mostrarMemoria() {

        let contenidor = document.getElementById("memoria");

        contenidor.innerHTML = "";

        for (let i = 0; i < 32; i++) {

            let fila = document.createElement("div");

            fila.className = "memoria-fila";

            if (i === PC) {
                fila.classList.add("activa");
            }

            fila.innerHTML =
                "<span>" + i + "</span>" +
                "<span>" + memoria[i] + "</span>";

            contenidor.appendChild(fila);
        }
    }


    // =========================
    // RESET
    // =========================

    function reiniciar() {

        PC = 0;
        AC = 0;
        IR = "---";
        MAR = 0;
        MDR = 0;

        memoria.fill(0);

        assemblat = false;
        aturat = false;

        for (let i = 0; i < 8; i++) {

            document
                .getElementById("led" + i)
                .classList.remove("encés");
        }

        document.getElementById("missatge").textContent =
            "CPU reiniciada.";

        actualitzarCPU();
    }


    // =========================
    // INICI
    // =========================

    actualitzarCPU();

</script>

</body>
</html>
